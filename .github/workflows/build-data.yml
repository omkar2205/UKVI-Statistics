name: Build UKVI dashboard data

on:
  push:
    branches: [main]
    paths:
      - 'UKVI Data 2020-2026 Q2.xlsx'
      - 'scripts/build-data.js'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Excel parser
        run: npm install --no-save xlsx@0.18.5

      - name: Build static JSON
        run: node scripts/build-data.js

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ukvi-data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Build UKVI dashboard JSON data"
            git push
          fi
